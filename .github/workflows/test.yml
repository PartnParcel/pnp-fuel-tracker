name: Fuel regression checks
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['fuel-rates.json']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
