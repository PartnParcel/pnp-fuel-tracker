name: Fuel Surcharge Update

on:
  schedule:
    # Retry throughout Monday; check twice daily on other days for corrections.
    # Off-hour minute reduces contention. GitHub scheduling is not a clock SLA.
    - cron: '17 * * * 1'
    - cron: '17 11,17 * * 0,2-6'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - '*.js'
      - 'package*.json'
      - 'ops/**'
      - '.github/workflows/fuel-update.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: fuel-publish
  cancel-in-progress: false

jobs:
  update-rates:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Regression tests
        run: npm test

      - name: Fetch fuel data and rebuild rates
        id: build
        env:
          # FedEx Rating API credentials (clean tracker account, list rates only).
          # Set these in Settings -> Secrets and variables -> Actions. If absent,
          # the job retains last-known FedEx rows and marks them stale.
          FEDEX_CLIENT_ID: ${{ secrets.FEDEX_CLIENT_ID }}
          FEDEX_CLIENT_SECRET: ${{ secrets.FEDEX_CLIENT_SECRET }}
          FEDEX_ACCOUNT: ${{ secrets.FEDEX_ACCOUNT }}
          UPS_CLIENT_ID: ${{ secrets.UPS_CLIENT_ID }}
          UPS_CLIENT_SECRET: ${{ secrets.UPS_CLIENT_SECRET }}
          UPS_ACCOUNT: ${{ secrets.UPS_ACCOUNT }}
          PUROLATOR_KEY: ${{ secrets.PUROLATOR_KEY }}
          PUROLATOR_PASSWORD: ${{ secrets.PUROLATOR_PASSWORD }}
          PUROLATOR_ACCOUNT: ${{ secrets.PUROLATOR_ACCOUNT }}
          PUROLATOR_BASE: https://webservices.purolator.com
        run: node fetch-and-build.js

      - name: Commit the updated rates
        id: publish
        run: |
          git config user.name "fuel-bot"
          git config user.email "fuel-bot@users.noreply.github.com"
          git add fuel-rates.json
          git diff --staged --quiet || git commit -m "Fuel rates updated $(date -u +%Y-%m-%d)"
          git push

      - name: Maintain one actionable exception issue
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FUEL_BUILD_OUTCOME: ${{ steps.build.outcome == 'success' && steps.publish.outcome == 'success' && 'success' || 'failure' }}
        run: node ops/report-health.js
